<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ألفيّة</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    body{font-family:system-ui,sans-serif;margin:0;background:#f4f6f9;padding-bottom:75px}
    header{background:#0b2545;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
    .card{background:#fff;border-radius:12px;padding:10px;border:1px solid #e2e8f0}
    .btn{background:#0b2545;color:#fff;border:none;border-radius:8px;padding:8px;width:100%;font-weight:700;margin-top:6px}
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:flex-end;z-index:50}
    .modal.open{display:flex}
    .box{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:16px;max-height:88vh;overflow:auto}
    input,select,textarea{width:100%;padding:9px;margin-top:6px;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}
    .send{background:#16a34a;color:#fff;border:none;border-radius:10px;padding:12px;width:100%;font-size:15px;font-weight:800;margin-top:10px}
    .bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
  </style>
</head>
<body>
  <header>
    <div><strong>ألفيّة</strong> <small style="color:#ff7b33">من الألف إلى الياء</small></div>
    <button onclick="openM()" style="background:#f26419;color:#fff;border:none;border-radius:8px;padding:7px 12px;font-weight:700">السلة (<span id="cnt">0</span>)</button>
  </header>

  <div class="grid" id="grid"></div>

  <div class="bar">
    <div>المجموع: <strong id="tot">0 د.ع</strong></div>
    <button onclick="openM()" style="background:#f26419;color:#fff;border:none;border-radius:8px;padding:9px 14px;font-weight:800">إتمام الحجز</button>
  </div>

  <div class="modal" id="m">
    <div class="box">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong>سلة ألفيّة</strong>
        <button onclick="closeM()" style="border:none;background:#e2e8f0;border-radius:50%;width:28px;height:28px">✕</button>
      </div>
      <div id="cartBox" style="margin:10px 0"></div>
      <div id="formBox" style="display:none">
        <input id="n" placeholder="الاسم الكامل *" />
        <input id="p" placeholder="رقم الموبايل *" />
        <select id="g">
          <option value="">اختر المحافظة *</option>
          <option>بغداد</option><option>البصرة</option><option>نينوى</option><option>أربيل</option>
          <option>النجف</option><option>كربلاء</option><option>بابل</option><option>الأنبار</option>
          <option>ديالى</option><option>ذي قار</option><option>صلاح الدين</option><option>كركوك</option>
          <option>واسط</option><option>ميسان</option><option>المثنى</option><option>الديوانية</option>
        </select>
        <input id="a" placeholder="المنطقة / العنوان *" />
        <textarea id="nt" rows="2" placeholder="ملاحظات"></textarea>
        <button class="send" onclick="goWA()">إرسال الحجز عبر واتساب</button>
      </div>
    </div>
  </div>

    <script>
    const WA = "9647874127622";
    const items = [
      {id:1, name:"منتج تجريبي 1", price:15000},
      {id:2, name:"منتج تجريبي 2", price:25000},
      {id:3, name:"منتج تجريبي 3", price:10000},
      {id:4, name:"منتج تجريبي 4", price:30000}
    ];
    let cart = [];

    function draw(){
      document.getElementById("grid").innerHTML = items.map(i => `
        <div class="card">
          <div><strong>${i.name}</strong></div>
          <div style="color:#f26419;font-weight:800;margin-top:4px">${i.price.toLocaleString()} د.ع</div>
          <button class="btn" onclick="add(${i.id})">أضف للسلة</button>
        </div>
      `).join("");
    }

    function add(id){
      const found = cart.find(x => x.id === id);
      if(found) found.q++;
      else cart.push({...items.find(x => x.id === id), q:1});
      sync();
    }

    function sync(){
      const cnt = cart.reduce((s,x)=>s+x.q,0);
      const tot = cart.reduce((s,x)=>s+x.q*x.price,0);
      document.getElementById("cnt").textContent = cnt;
      document.getElementById("tot").textContent = tot.toLocaleString() + " د.ع";
    }

    function openM(){
      document.getElementById("m").classList.add("open");
      const box = document.getElementById("cartBox");
      const form = document.getElementById("formBox");
      if(!cart.length){
        box.innerHTML = "<p>السلة فارغة</p>";
        form.style.display = "none";
        return;
      }
      box.innerHTML = cart.map(x => `<div>${x.name} × ${x.q} = ${(x.price*x.q).toLocaleString()} د.ع</div>`).join("");
      form.style.display = "block";
    }

    function closeM(){
      document.getElementById("m").classList.remove("open");
    }

    function goWA(){
      const n = document.getElementById("n").value.trim();
      const p = document.getElementById("p").value.trim();
      const g = document.getElementById("g").value;
      const a = document.getElementById("a").value.trim();
      const nt = document.getElementById("nt").value.trim();
      if(!n || !p || !g || !a){
        alert("يرجى ملء الحقول المطلوبة");
        return;
      }
      const tot = cart.reduce((s,x)=>s+x.q*x.price,0);
      const lines = cart.map(x => `- ${x.name} (${x.q}) = ${(x.price*x.q).toLocaleString()} د.ع`).join("%0A");
      const msg = `*حجز جديد - متجر ألفيّة*%0Aالاسم: ${n}%0Aالموبايل: ${p}%0Aالمحافظة: ${g}%0Aالعنوان: ${a}%0Aالمنتجات:%0A${lines}%0Aالمجموع: ${tot.toLocaleString()} د.ع${nt ? "%0Aملاحظات: "+nt : ""}`;
      const url = `https://api.whatsapp.com/send?phone=${WA}&text=${msg}`;
      window.location.href = url;
    }

    draw();
  </script>
</body>
</html>
