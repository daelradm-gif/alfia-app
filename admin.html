<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة مدير متجر ألفيّة</title>
  <style>
    :root {
      --bg: #0c0e12;
      --card: #151921;
      --card-2: #1c212b;
      --border: #2a3140;
      --text: #f3f5f8;
      --muted: #9aa3b2;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --danger: #ef4444;
      --success: #22c55e;
      --paused: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 780px;
      margin: 0 auto 50px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(245, 158, 11, 0.14);
      color: var(--accent);
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .card-header h2 {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #e5e7eb;
    }

    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 5px;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 13px;
      border-radius: 11px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--accent);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 560px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .upload-box {
      border: 1.5px dashed #475569;
      background: var(--card-2);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .upload-box:hover {
      border-color: var(--accent);
    }

    .upload-box input[type="file"] {
      display: none;
    }

    .upload-icon {
      font-size: 1.6rem;
      margin-bottom: 4px;
    }

    .upload-count {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .previews {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .preview-item {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      aspect-ratio: 1 / 1;
      background: #0f1218;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .main-tag {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.75);
      color: var(--accent);
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 700;
    }

    .remove-img-btn {
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(239, 68, 68, 0.92);
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.8rem;
      line-height: 1;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-2);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 11px;
      margin-bottom: 14px;
      cursor: pointer;
    }

    .check-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #111318;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      min-height: 22px;
    }

    .status-ok {
      color: var(--success);
    }

    .status-err {
      color: var(--danger);
    }

    .products-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-card {
      display: flex;
      gap: 12px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      align-items: flex-start;
    }

    .product-card.paused {
      opacity: 0.68;
      border-style: dashed;
    }

    .product-thumb {
      width: 76px;
      height: 76px;
      border-radius: 10px;
      object-fit: cover;
      background: #0e1117;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .product-info {
      flex: 1;
      min-width: 0;
    }

    .product-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 4px;
    }

    .product-name {
      font-weight: 700;
      font-size: 1rem;
    }

    .pill {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
    }

    .pill-new {
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
    }

    .pill-paused {
      background: rgba(148, 163, 184, 0.2);
      color: #cbd5e1;
    }

    .pill-active {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent);
    }

    .product-meta {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .price-sale {
      color: var(--accent);
      font-weight: 700;
    }

    .price-orig {
      text-decoration: line-through;
      color: #7c8594;
      margin-right: 6px;
      font-size: 0.8rem;
    }

    .product-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .btn-sm {
      padding: 6px 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-sm:hover {
      border-color: var(--accent);
    }

    .btn-delete {
      background: rgba(239, 68, 68, 0.14);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.35);
    }

    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    .empty-msg {
      color: var(--muted);
      font-size: 0.92rem;
      padding: 10px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand-title">لوحة مدير متجر ألفيّة</div>
      <div class="badge-live">alfia-store • مباشر</div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2 id="formHeading">إضافة منتج جديد</h2>
        <button type="button" class="btn-ghost" id="cancelEditBtn" style="display:none;">إلغاء التعديل</button>
      </div>

      <form id="productForm">
        <div class="form-group">
          <label>صور المنتج</label>
          <div class="upload-count" id="imagesCountText">0 / 6</div>
          <label class="upload-box" for="imageInput">
            <div class="upload-icon">⬆</div>
            <div>ارفع الصور من الاستوديو</div>
            <input type="file" id="imageInput" accept="image/*" multiple />
          </label>
          <div class="hint">أول صورة هي الصورة الرئيسية في المتجر. يمكنك إضافة حتى 6 صور.</div>
          <div class="previews" id="previewsBox"></div>
        </div>

        <div class="form-group">
          <label for="productName">اسم المنتج</label>
          <input type="text" id="productName" placeholder="مثال: سماعات لاسلكية" required />
        </div>

        <div class="form-group">
          <label for="categorySelect">القسم</label>
          <select id="categorySelect">
            <option value="">اختر القسم</option>
            <option value="ملابس">ملابس</option>
            <option value="رواجع أمازون">رواجع أمازون</option>
            <option value="اكسسوارات">اكسسوارات</option>
            <option value="قطع غيار">قطع غيار</option>
            <option value="أدوات منزلية">أدوات منزلية</option>
            <option value="__custom__">+ قسم جديد...</option>
          </select>
          <input
            type="text"
            id="customCategoryInput"
            placeholder="اكتب اسم القسم الجديد"
            style="display:none; margin-top:8px;"
          />
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="originalPrice">السعر الأصلي (د.ع)</label>
            <input type="number" id="originalPrice" min="0" step="250" placeholder="مثال: 25000" />
          </div>

          <div class="form-group">
            <label for="salePrice">سعر البيع (د.ع)</label>
            <input type="number" id="salePrice" min="0" step="250" placeholder="مثال: 15000" required />
          </div>
        </div>

        <div class="form-group">
          <label for="stockQty">عدد القطع</label>
          <input type="number" id="stockQty" min="0" step="1" placeholder="مثال: 10" required />
        </div>

        <label class="check-row" for="isNewCheckbox">
          <input type="checkbox" id="isNewCheckbox" checked />
          <span>منتج جديد (يظهر بالبداية فوق داخل قسمه)</span>
        </label>

        <button type="submit" class="btn-primary" id="submitBtn">إضافة المنتج وحفظه فوراً</button>
        <div class="status-msg" id="statusMsg"></div>
      </form>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>المنتجات المحفوظة حالياً</h2>
      </div>
      <div class="products-list" id="productsList">
        <div class="empty-msg">جاري تحميل المنتجات...</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getDatabase,
      ref,
      push,
      set,
      update,
      remove,
      onValue
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCwKhkIyhlmNOAHocg5WDF-v5LlS7uevOE",
      authDomain: "alfia-store.firebaseapp.com",
      databaseURL: "https://alfia-store-default-rtdb.firebaseio.com",
      projectId: "alfia-store",
      storageBucket: "alfia-store.firebasestorage.app",
      messagingSenderId: "666569828298",
      appId: "1:666569828298:web:e92bcbdad3f6d047331133",
      measurementId: "G-EQQ5E7DSYF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const productsRef = ref(db, "products");

    const MAX_IMAGES = 6;
    let selectedImages = [];
    let editingId = null;
    let cachedProducts = [];

    const form = document.getElementById("productForm");
    const formHeading = document.getElementById("formHeading");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const imageInput = document.getElementById("imageInput");
    const imagesCountText = document.getElementById("imagesCountText");
    const previewsBox = document.getElementById("previewsBox");
    const productNameInput = document.getElementById("productName");
    const categorySelect = document.getElementById("categorySelect");
    const customCategoryInput = document.getElementById("customCategoryInput");
    const originalPriceInput = document.getElementById("originalPrice");
    const salePriceInput = document.getElementById("salePrice");
    const stockQtyInput = document.getElementById("stockQty");
    const isNewCheckbox = document.getElementById("isNewCheckbox");
    const submitBtn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("statusMsg");
    const productsList = document.getElementById("productsList");

    function setStatus(text, type = "") {
      statusMsg.textContent = text;
      statusMsg.className = "status-msg " + (type === "ok" ? "status-ok" : type === "err" ? "status-err" : "");
    }

    function formatIQD(num) {
      const n = Number(num || 0);
      return n.toLocaleString("en-US") + " د.ع";
    }

    function compressImageFile(file, maxWidth = 800, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function renderImagePreviews() {
      imagesCountText.textContent = `${selectedImages.length} / ${MAX_IMAGES}`;
      previewsBox.innerHTML = "";

      selectedImages.forEach((src, index) => {
        const item = document.createElement("div");
        item.className = "preview-item";

        const img = document.createElement("img");
        img.src = src;
        img.alt = "صورة المنتج";

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "remove-img-btn";
        delBtn.textContent = "×";
        delBtn.title = "حذف الصورة";
        delBtn.addEventListener("click", () => {
          selectedImages.splice(index, 1);
          renderImagePreviews();
        });

        item.appendChild(img);
        item.appendChild(delBtn);

        if (index === 0) {
          const badge = document.createElement("span");
          badge.className = "main-tag";
          badge.textContent = "رئيسية";
          item.appendChild(badge);
        }

        previewsBox.appendChild(item);
      });
    }

    imageInput.addEventListener("change", async (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;

      const availableSlots = MAX_IMAGES - selectedImages.length;
      if (availableSlots <= 0) {
        setStatus(`الحد الأقصى هو ${MAX_IMAGES} صور لكل منتج.`, "err");
        imageInput.value = "";
        return;
      }

      const filesToProcess = files.slice(0, availableSlots);
      submitBtn.disabled = true;
      setStatus("جاري تجهيز وضغط الصور من الاستوديو...");

      try {
        for (const file of filesToProcess) {
          const compressed = await compressImageFile(file);
          selectedImages.push(compressed);
        }
        renderImagePreviews();
        if (files.length > availableSlots) {
          setStatus(`تمت إضافة ${filesToProcess.length} صور فقط لأن الحد الأقصى ${MAX_IMAGES} صور.`, "ok");
        } else {
          setStatus("تم تجهيز الصور بنجاح.", "ok");
        }
      } catch {
        setStatus("حدث خطأ أثناء قراءة الصورة، جرّب صورة أخرى.", "err");
      } finally {
        submitBtn.disabled = false;
        imageInput.value = "";
      }
    });

    categorySelect.addEventListener("change", () => {
      customCategoryInput.style.display = categorySelect.value === "__custom__" ? "block" : "none";
      if (categorySelect.value === "__custom__") {
        customCategoryInput.focus();
      }
    });

    function resetForm() {
      editingId = null;
      selectedImages = [];
      form.reset();
      customCategoryInput.style.display = "none";
      isNewCheckbox.checked = true;
      formHeading.textContent = "إضافة منتج جديد";
      submitBtn.textContent = "إضافة المنتج وحفظه فوراً";
      cancelEditBtn.style.display = "none";
      renderImagePreviews();
    }

    cancelEditBtn.addEventListener("click", () => {
      resetForm();
      setStatus("تم إلغاء التعديل.");
    });

    function startEditProduct(product) {
      editingId = product.id;
      formHeading.textContent = "تعديل المنتج";
      submitBtn.textContent = "حفظ التعديلات فوراً";
      cancelEditBtn.style.display = "inline-block";

      productNameInput.value = product.name || "";

      const knownOptions = Array.from(categorySelect.options).map((o) => o.value);
      if (knownOptions.includes(product.category) && product.category !== "__custom__") {
        categorySelect.value = product.category;
        customCategoryInput.style.display = "none";
        customCategoryInput.value = "";
      } else {
        categorySelect.value = "__custom__";
        customCategoryInput.style.display = "block";
        customCategoryInput.value = product.category || "";
      }

      originalPriceInput.value = product.originalPrice ?? "";
      salePriceInput.value = product.salePrice ?? "";
      stockQtyInput.value = product.stock ?? 0;
      isNewCheckbox.checked = Boolean(product.isNew);

      selectedImages = Array.isArray(product.images)
        ? [...product.images].slice(0, MAX_IMAGES)
        : product.image
        ? [product.image]
        : [];

      renderImagePreviews();
      setStatus(`أنت الآن تعدّل المنتج: ${product.name}`);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = productNameInput.value.trim();
      const category =
        categorySelect.value === "__custom__"
          ? customCategoryInput.value.trim()
          : categorySelect.value.trim();
      const originalPrice = originalPriceInput.value === "" ? null : Number(originalPriceInput.value);
      const salePrice = Number(salePriceInput.value);
      const stock = Number(stockQtyInput.value);
      const isNew = isNewCheckbox.checked;

      if (!name) {
        setStatus("يرجى إدخال اسم المنتج.", "err");
        return;
      }
      if (!category) {
        setStatus("يرجى اختيار أو كتابة القسم.", "err");
        return;
      }
      if (isNaN(salePrice) || salePrice < 0) {
        setStatus("يرجى إدخال سعر بيع صحيح بالدينار العراقي.", "err");
        return;
      }
      if (isNaN(stock) || stock < 0) {
        setStatus("يرجى إدخال عدد القطع بشكل صحيح.", "err");
        return;
      }

      submitBtn.disabled = true;
      setStatus("جاري الحفظ في قاعدة البيانات...");

      const existingProduct = editingId ? cachedProducts.find((p) => p.id === editingId) : null;

      const payload = {
        name,
        category,
        originalPrice,
        salePrice,
        stock,
        isNew,
        isPaused: existingProduct ? Boolean(existingProduct.isPaused) : false,
        images: selectedImages,
        image: selectedImages[0] || "",
        updatedAt: Date.now()
      };

      try {
        if (editingId) {
          await update(ref(db, `products/${editingId}`), payload);
          setStatus("تم تحديث المنتج وحفظه بنجاح!", "ok");
        } else {
          payload.createdAt = Date.now();
          const newRef = push(productsRef);
          await set(newRef, payload);
          setStatus("تمت إضافة المنتج وحفظه بنجاح!", "ok");
        }
        resetForm();
      } catch (err) {
        setStatus("فشل الحفظ: تأكد من اتصال الإنترنت وقواعد قاعدة البيانات.", "err");
      } finally {
        submitBtn.disabled = false;
      }
    });

    function renderProductsList(items) {
      if (!items.length) {
        productsList.innerHTML = `<div class="empty-msg">لا توجد منتجات مضافة بعد في قاعدة البيانات.</div>`;
        return;
      }

      productsList.innerHTML = "";

      items.forEach((item) => {
        const card = document.createElement("div");
        card.className = "product-card" + (item.isPaused ? " paused" : "");

        const img = document.createElement("img");
        img.className = "product-thumb";
        img.src = (item.images && item.images[0]) || item.image || "";
        img.alt = item.name || "منتج";
        img.style.visibility = img.src ? "visible" : "hidden";

        const info = document.createElement("div");
        info.className = "product-info";

        const titleRow = document.createElement("div");
        titleRow.className = "product-title-row";

        const nameEl = document.createElement("span");
        nameEl.className = "product-name";
        nameEl.textContent = item.name || "بدون اسم";
        titleRow.appendChild(nameEl);

        if (item.isNew) {
          const newPill = document.createElement("span");
          newPill.className = "pill pill-new";
          newPill.textContent = "جديد";
          titleRow.appendChild(newPill);
        }

        const statusPill = document.createElement("span");
        statusPill.className = "pill " + (item.isPaused ? "pill-paused" : "pill-active");
        statusPill.textContent = item.isPaused ? "متوقف مؤقتاً" : "نشط";
        titleRow.appendChild(statusPill);

        const metaEl = document.createElement("div");
        metaEl.className = "product-meta";

        const saleSpan = document.createElement("span");
        saleSpan.className = "price-sale";
        saleSpan.textContent = formatIQD(item.salePrice);

        metaEl.append("القسم: ", item.category || "غير محدد", " • السعر: ", saleSpan);

        if (item.originalPrice && Number(item.originalPrice) > 0) {
          const origSpan = document.createElement("span");
          origSpan.className = "price-orig";
          origSpan.textContent = formatIQD(item.originalPrice);
          metaEl.appendChild(origSpan);
        }

        metaEl.append(" • القطع: ", String(item.stock ?? 0));

        const actions = document.createElement("div");
        actions.className = "product-actions";

        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.className = "btn-sm";
        editBtn.textContent = "تعديل";
        editBtn.addEventListener("click", () => startEditProduct(item));

        const pauseBtn = document.createElement("button");
        pauseBtn.type = "button";
        pauseBtn.className = "btn-sm";
        pauseBtn.textContent = item.isPaused ? "تشغيل" : "إيقاف مؤقت";
        pauseBtn.addEventListener("click", async () => {
          try {
            await update(ref(db, `products/${item.id}`), {
              isPaused: !item.isPaused,
              updatedAt: Date.now()
            });
            setStatus(
              !item.isPaused
                ? `تم إيقاف "${item.name}" مؤقتاً.`
                : `تم إعادة تشغيل "${item.name}".`,
              "ok"
            );
          } catch {
            setStatus("تعذر تغيير حالة المنتج.", "err");
          }
        });

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "btn-sm btn-delete";
        delBtn.textContent = "حذف";
        delBtn.addEventListener("click", async () => {
          try {
            await remove(ref(db, `products/${item.id}`));
            if (editingId === item.id) {
              resetForm();
            }
            setStatus(`تم حذف "${item.name}" بنجاح.`, "ok");
          } catch {
            setStatus("تعذر حذف المنتج.", "err");
          }
        });

        actions.append(editBtn, pauseBtn, delBtn);
        info.append(titleRow, metaEl, actions);
        card.append(img, info);
        productsList.appendChild(card);
      });
    }

    onValue(
      productsRef,
      (snapshot) => {
        const data = snapshot.val();
        if (!data) {
          cachedProducts = [];
          renderProductsList([]);
          return;
        }

        const list = Object.entries(data).map(([id, val]) => ({
          id,
          ...val
        }));

        list.sort((a, b) => {
          if (Boolean(a.isNew) !== Boolean(b.isNew)) {
            return a.isNew ? -1 : 1;
          }
          return (b.createdAt || 0) - (a.createdAt || 0);
        });

        cachedProducts = list;
        renderProductsList(list);
      },
      () => {
        productsList.innerHTML = `<div class="empty-msg">تعذر قراءة المنتجات من قاعدة البيانات.</div>`;
      }
    );

    renderImagePreviews();
  </script>
</body>
</html>
